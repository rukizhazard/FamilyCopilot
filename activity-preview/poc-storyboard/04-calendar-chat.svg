<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img" aria-labelledby="title desc">
  <title id="title">One conversation, with the existing calendar still in reach</title>
  <desc id="desc">Concept only. A cream and lilac chat interface with a smiling sun, a family context strip for one eight-year-old child, varied interests, and an expanded sample weekly calendar. The actual demo should show the existing calendar's real Sync result and freshness, not this fictional grid.</desc>
  <rect width="1100" height="840" rx="30" fill="#fcf9f5"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#352e49">
    <circle cx="62" cy="53" r="21" fill="#ffdc86"/><circle cx="55" cy="50" r="2.3"/><circle cx="69" cy="50" r="2.3"/><path d="M55 59 Q62 66 69 59" fill="none" stroke="#684b2b" stroke-width="2"/>
    <text x="96" y="51" font-size="23" font-weight="700">Family Copilot</text>
    <text x="96" y="73" font-size="13" fill="#625a70">A little more room for happy days.</text>
    <text x="1056" y="50" text-anchor="end" font-size="12" fill="#625a70">01 / CONCEPT · SAMPLE CALENDAR</text>
    <rect x="40" y="98" width="1020" height="98" rx="22" fill="#eee7fa"/>
    <text x="64" y="129" font-size="17" font-weight="600">Your family · One child, age 8</text>
    <text x="590" y="129" font-size="16">Starting near your office · Xinyi, Taipei</text>
    <text x="64" y="160" font-size="14" fill="#624199">Example interests: Sports · Science · Art · Nature · Music · Movies · Exhibitions</text>
    <text x="64" y="182" font-size="12" fill="#625a70">Preferences set beforehand · No date horizon to configure</text>
    <rect x="677" y="216" width="383" height="45" rx="18" fill="#fff0e1"/>
    <text x="699" y="245" font-size="18">Let's take a look at our week.</text>
    <circle cx="63" cy="299" r="21" fill="#ffdc86"/><text x="63" y="306" text-anchor="middle" font-size="23">✦</text>
    <text x="102" y="302" font-size="21" font-weight="600">Your calendar, right here.</text>
    <text x="102" y="330" font-size="15" fill="#625a70">Keep the familiar weekly view. Stay in the conversation.</text>
    <rect x="102" y="350" width="958" height="319" rx="22" fill="white" stroke="#d8cde5"/>
    <text x="127" y="386" font-size="23" font-weight="700">Our week</text>
    <text x="127" y="414" font-size="14" fill="#625a70">Oct 9–15, 2026 · Taipei (UTC+8)</text>
    <rect x="805" y="368" width="92" height="39" rx="13" fill="#624199"/><text x="851" y="393" text-anchor="middle" fill="white" font-size="15">Sync</text>
    <text x="937" y="393" font-size="15" fill="#624199">Collapse ↑</text>
    <path d="M126 459 H1035 M126 508 H1035 M126 557 H1035 M126 606 H1035 M275 434 V606 M384 434 V606 M493 434 V606 M602 434 V606 M711 434 V606 M820 434 V606 M929 434 V606" stroke="#ece6f1" fill="none"/>
    <g font-size="13" fill="#625a70" text-anchor="middle"><text x="330" y="450">Fri 9</text><text x="439" y="450">Sat 10</text><text x="548" y="450">Sun 11</text><text x="657" y="450">Mon 12</text><text x="766" y="450">Tue 13</text><text x="875" y="450">Wed 14</text><text x="984" y="450">Thu 15</text></g>
    <g font-size="14"><text x="145" y="490">Parent A</text><text x="145" y="539">Parent B</text><text x="145" y="588">Child · age 8</text></g>
    <g fill="#eee7fa"><rect x="289" y="470" width="79" height="28" rx="8"/><rect x="616" y="470" width="79" height="28" rx="8"/><rect x="834" y="470" width="79" height="28" rx="8"/></g>
    <g fill="#e8f2e8"><rect x="507" y="519" width="79" height="28" rx="8"/><rect x="725" y="519" width="79" height="28" rx="8"/></g>
    <g fill="#fff0e1"><rect x="398" y="568" width="79" height="28" rx="8"/><rect x="943" y="568" width="79" height="28" rx="8"/></g>
    <g text-anchor="middle" font-size="12"><text x="329" y="489">Busy</text><text x="656" y="489">Busy</text><text x="874" y="489">Busy</text><text x="547" y="538">Busy</text><text x="765" y="538">Busy</text><text x="438" y="587">Activity</text><text x="983" y="587">Activity</text></g>
    <text x="127" y="644" font-size="13" fill="#625a70">Illustrative grid only · Empty space is not verified availability</text>
    <rect x="102" y="690" width="958" height="57" rx="18" fill="white" stroke="#d8cde5"/>
    <text x="125" y="725" font-size="17" fill="#625a70">Ask anything, or let Copilot bring you ideas…</text>
    <circle cx="1027" cy="718" r="20" fill="#624199"/><text x="1027" y="725" text-anchor="middle" font-size="23" fill="white">↑</text>
    <text x="40" y="790" font-size="19" font-weight="600">Demo opening: show real Sync + source + last updated.</text>
    <text x="40" y="816" font-size="13" fill="#625a70">Reuse the existing calendar UI in this panel; this drawing is not proof of a live load.</text>
  </g>
</svg>