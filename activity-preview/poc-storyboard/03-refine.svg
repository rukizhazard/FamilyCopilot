    <text x="72" y="242" font-size="21">Something closer, and preferably Sunday afternoon.</text>
    <rect x="807" y="204" width="82" height="42" rx="13" fill="#7155ac"/>
    <text x="848" y="231" text-anchor="middle" font-size="16" fill="white">Send ↑</text>
    <circle cx="72" cy="307" r="23" fill="#eee6fb"/>
