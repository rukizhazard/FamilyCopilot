  <title id="title">AI starts the conversation with illustrated activity cards</title>
  <desc id="desc">Fictional suggestions in the same chat. Calendar is collapsed. Broad interests and one child age eight inform two example suggestions, a basketball game and a movie. Original fictional team badges and a movie poster are thumbnails, not real provider assets. AI chooses dates without a look-ahead setting.</desc>
