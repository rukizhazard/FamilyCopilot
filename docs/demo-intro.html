<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'">
  <title>Family Copilot · A weekend together</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #142e2a; color: #193e36; font-family: 'Segoe UI', Arial, sans-serif; }
    .stage { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.777vh; margin: auto; overflow: hidden; background: #f6f2e8; }
    svg { width: 100%; height: 100%; display: block; }
    .brand { position: absolute; top: 5.8%; left: 6%; display: flex; gap: .6em; align-items: center; font-size: clamp(12px, 1.3vw, 25px); font-weight: 600; letter-spacing: -.02em; }
    .mark { display: inline-block; width: 1.1em; height: 1.1em; border: .24em solid #5b8270; border-radius: 50% 50% 50% 12%; transform: rotate(-25deg); }
    .eyebrow { position: absolute; right: 6%; top: 6.5%; font-size: clamp(9px, .85vw, 17px); letter-spacing: .16em; color: #66796c; }
    .headings { position: absolute; inset: 17% 6% auto; text-align: center; }
    h1 { margin: 0; font-size: clamp(22px, 3.7vw, 72px); letter-spacing: -.045em; font-weight: 600; line-height: 1.13; }
    .heading { position: absolute; inset: 0; opacity: 0; }
    .sub { margin-top: 1.1em; font-size: clamp(11px, 1.2vw, 24px); color: #68786d; letter-spacing: .01em; }
    .end { position: absolute; inset: 33% 6% auto; text-align: center; opacity: 0; }
    .end h1 { font-size: clamp(24px, 4.4vw, 86px); }
    .end .sub { font-size: clamp(13px, 1.5vw, 29px); }
    .replay { position: fixed; bottom: 15px; right: 16px; padding: 10px 18px; border-radius: 30px; border: 1px solid #ffffff80; background: #193e36; color: white; cursor: pointer; font: inherit; }
    .replay:focus-visible { outline: 3px solid #f0c172; outline-offset: 4px; }
    .recording .replay { display: none; }
    .scene { opacity: 1; }
    .h1 { animation: first 15.2s both; }
    .h2 { animation: second 15.2s both; }
    .end { animation: ending 15.2s both; }
    .scene { animation: sceneOut 15.2s both; }
    .left-person { animation: comeLeft 15.2s both; }
    .right-person { animation: comeRight 15.2s both; }
    .child { animation: childHop 15.2s both; }
    .routine { animation: routine 15.2s both; }
    .weekend { animation: weekend 15.2s both; transform-origin: 960px 520px; }
    .heart { animation: heart 15.2s both; transform-origin: 960px 400px; }
    .sun { animation: sun 15.2s both; transform-origin: 1550px 700px; }
    .path { stroke-dasharray: 8 15; animation: path 15.2s both; }
    @keyframes first { 0% { opacity:0; transform:translateY(14px); } 5%,29% { opacity:1; transform:translateY(0); } 35%,100% { opacity:0; transform:translateY(-10px); } }
    @keyframes second { 0%,33% { opacity:0; transform:translateY(14px); } 40%,70% { opacity:1; transform:translateY(0); } 77%,100% { opacity:0; transform:translateY(-10px); } }
    @keyframes ending { 0%,77% { opacity:0; transform:translateY(14px); } 85%,100% { opacity:1; transform:translateY(0); } }
    @keyframes sceneOut { 0%,74% { opacity:1; } 84%,100% { opacity:0; } }
    @keyframes comeLeft { 0%,32% { transform:translateX(-220px); } 50%,100% { transform:translateX(0); } }
    @keyframes comeRight { 0%,32% { transform:translateX(220px); } 50%,100% { transform:translateX(0); } }
    @keyframes childHop { 0%,35% { transform:translateY(0); } 41% { transform:translateY(-28px); } 46%,100% { transform:translateY(0); } }
    @keyframes routine { 0% { opacity:0; transform:translateY(18px); } 8%,27% { opacity:1; transform:translateY(0); } 37%,100% { opacity:0; transform:translateY(-25px); } }
    @keyframes weekend { 0%,36% { opacity:0; transform:scale(.92); } 48%,100% { opacity:1; transform:scale(1); } }
    @keyframes heart { 0%,47% { opacity:0; transform:scale(.5); } 54% { opacity:1; transform:scale(1.12); } 59%,100% { opacity:1; transform:scale(1); } }
    @keyframes sun { 0%,31% { opacity:.3; transform:translateY(65px); } 52%,100% { opacity:1; transform:translateY(0); } }
    @keyframes path { 0%,39% { opacity:0; } 54%,100% { opacity:.5; } }
    @media (prefers-reduced-motion: reduce) {
      .stage:not(.capture) * { animation: none !important; }
      .stage:not(.capture) .scene, .stage:not(.capture) .heading { opacity: 0; }
      .stage:not(.capture) .end { opacity: 1; }
    }
  </style>
</head>
<body>

    <div class="end"><h1>What could we do together?</h1><p class="sub">Start with our week. Make room for a little joy.</p></div>
  </main>
  <button class="replay" type="button">Replay animation</button>
  <script>
    const stage = document.querySelector('.stage');
    window.intro = Object.freeze({
      duration: 15.2,
      seek(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0 || seconds > 15.2) throw Error('Invalid intro time');
        stage.classList.add('capture');
        for (const animation of document.getAnimations()) { animation.pause(); animation.currentTime = seconds * 1000; }
      }
    });
    document.querySelector('.replay').addEventListener('click', () => {
      for (const animation of document.getAnimations()) { animation.currentTime = 0; animation.play(); }
    });
    if (new URLSearchParams(location.search).has('record')) document.body.classList.add('recording');
  </script>
</body>
</html>
